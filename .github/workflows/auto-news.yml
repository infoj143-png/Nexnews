name: Autonomous Background News Generator

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Auto-News Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python scripts/auto_news.py

      - name: Commit and push generated news articles
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles/
          if git diff --staged --quiet; then
            echo "No new articles generated or changed."
          else
            git commit -m "feat(auto-news): publish automated background article"
            git push
            if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
              echo "Triggering Vercel Deploy Hook..."
              curl -X POST "$VERCEL_DEPLOY_HOOK_URL"
            else
              echo "VERCEL_DEPLOY_HOOK_URL secret is not set, skipping deploy hook."
            fi
          fi
